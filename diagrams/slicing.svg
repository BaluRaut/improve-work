<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
  <title id="t">Split by layer versus split by outcome</title>
  <desc id="d">On the left, three items each cover one layer, so nothing works until all three are done. On the right, four items each cut through UI, API and database, so each works end to end.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2430; }
    .h { font-size: 16px; font-weight: 700; }
    .s { font-size: 13px; }
    .m { font-size: 12px; fill: #5d6475; }
    .id { font-size: 12px; font-weight: 700; font-family: ui-monospace, Menlo, Consolas, monospace; }
  </style>
  <rect x="0.5" y="0.5" width="759" height="299" rx="12" fill="#ffffff" stroke="#e3e6ec"/>

  <!-- Split by layer -->
  <text x="24" y="34" class="h" style="fill:#b54708">✗ Split by layer</text>
  <rect x="24" y="64" width="330" height="46" rx="6" fill="#fef0c7" stroke="#dc6803"/>
  <text x="38" y="92" class="s">Item 1: all the UI work</text>
  <rect x="24" y="120" width="330" height="46" rx="6" fill="#fef0c7" stroke="#dc6803"/>
  <text x="38" y="148" class="s">Item 2: all the API work</text>
  <rect x="24" y="176" width="330" height="46" rx="6" fill="#fef0c7" stroke="#dc6803"/>
  <text x="38" y="204" class="s">Item 3: all the database work</text>
  <text x="24" y="256" class="s">Nothing works until all three are done.</text>
  <text x="24" y="276" class="m">Testing and demos wait for the last item.</text>

  <!-- Split by outcome -->
  <text x="400" y="34" class="h" style="fill:#027a48">✓ Split by outcome</text>
  <rect x="400" y="64" width="336" height="46" fill="#f2f4f7"/>
  <rect x="400" y="120" width="336" height="46" fill="#f2f4f7"/>
  <rect x="400" y="176" width="336" height="46" fill="#f2f4f7"/>
  <text x="408" y="92" class="m">UI</text>
  <text x="408" y="148" class="m">API</text>
  <text x="408" y="204" class="m">Database</text>

  <rect x="476" y="58" width="56" height="170" rx="6" fill="#d1fadf" stroke="#039855" opacity=".95"/>
  <rect x="541" y="58" width="56" height="170" rx="6" fill="#d1fadf" stroke="#039855" opacity=".95"/>
  <rect x="606" y="58" width="56" height="170" rx="6" fill="#d1fadf" stroke="#039855" opacity=".95"/>
  <rect x="671" y="58" width="56" height="170" rx="6" fill="#d1fadf" stroke="#039855" opacity=".95"/>
  <text x="504" y="80" class="id" text-anchor="middle">WB-04</text>
  <text x="569" y="80" class="id" text-anchor="middle">WB-06</text>
  <text x="634" y="80" class="id" text-anchor="middle">WB-07</text>
  <text x="699" y="80" class="id" text-anchor="middle">WB-08</text>
  <text x="504" y="246" class="m" text-anchor="middle">Cancel</text>
  <text x="569" y="246" class="m" text-anchor="middle">Refunds</text>
  <text x="634" y="246" class="m" text-anchor="middle">Errors</text>
  <text x="699" y="246" class="m" text-anchor="middle">Apps</text>
  <text x="400" y="276" class="s">Each slice works end to end and can ship alone.</text>
</svg>
